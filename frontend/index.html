<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="logo-mark" src="assets/chat-logo.png" alt="" />
        <span class="brand-name brand-wordmark" aria-label="あいづち">
          <span class="word-char">あ</span>
          <span class="word-char">い</span>
          <span class="word-char">つ<span class="talk-marks" aria-hidden="true"><i><b class="thumb-mark"></b></i><i>♥</i></span></span>
          <span class="word-char">ち</span>
        </span>
      </div>
      <div class="live-status" id="liveStatus">
        <button class="user-chip" id="userBtn" type="button" aria-label="ユーザー名を変更">
          <span class="user-avatar" id="userAvatar">?</span>
          <span id="userName">未設定</span>
        </button>
        <button class="logout-btn" id="logoutBtn" type="button">ログアウト</button>
        <button class="archive-open" id="archiveBtn" type="button">📅 アーカイブ</button>
        <span class="live-badge" id="liveBadge">OFFLINE</span>
        <span class="viewers" id="viewers">👤 0</span>
      </div>
    </header>

    <main class="stage">
      <!-- 配信映像 -->
      <section class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="capture" hidden></canvas>

        <div class="video-overlay" id="startOverlay">
          <p>カメラとマイクを使って、AIの視聴者と一緒に配信を始めます。</p>
          <div class="start-actions">
            <button class="btn btn-primary" id="startBtn">配信を始める</button>
          </div>
        </div>

        <div class="video-controls" id="videoControls" hidden>
          <div class="ctrl-right">
            <label class="mode-label" id="cameraLabel" hidden>
              カメラ
              <select id="cameraSelect"></select>
            </label>
            <button class="btn btn-stop" id="stopBtn">配信を終える</button>
          </div>
        </div>

        <div class="danmaku-layer" id="danmakuLayer"></div>
      </section>

      <!-- コメント欄 -->
      <aside class="chat-wrap" id="chatWrap">
        <div class="chat-head">
          <span>チャット</span>
          <label class="flow-switch" for="flowToggle">
            <span class="flow-switch-label">コメント流し</span>
            <input type="checkbox" id="flowToggle" aria-label="コメント流しをオンにする">
            <span class="flow-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div class="chat-note" id="chatNote">配信を始めるとコメントが流れます。</div>
      </aside>
    </main>

    <!-- 初回ユーザー名設定 -->
    <div class="modal user-modal" id="userModal" hidden>
      <div class="fluffy-bg" aria-hidden="true">
        <span class="fluffy fluffy-blue"></span>
        <span class="fluffy fluffy-rainbow"></span>
        <span class="fluffy fluffy-soft"></span>
      </div>
      <div class="smoke-stage" id="smokeStage" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <section class="onboarding-message startup-message" id="startupMessage" hidden>
        <span class="onboarding-logo-dot" aria-hidden="true">
          <img src="assets/chat-logo.png" alt="" />
        </span>
        <small class="service-label">AI Streaming</small>
        <p class="aizuchi-wordmark" aria-label="あいづち">
          <span class="word-char char-a">あ</span>
          <span class="word-char char-i">い</span>
          <span class="word-char char-tsu">つ<span class="talk-marks" aria-hidden="true"><i><b class="thumb-mark"></b></i><i>♥</i></span></span>
          <span class="word-char char-chi">ち</span>
        </p>
        <div class="startup-actions">
          <button class="startup-btn startup-btn-primary" id="startOnboarding" type="button">配信を始める</button>
          <button class="startup-btn startup-btn-secondary" id="browseArchive" type="button">過去の配信を振り返る</button>
        </div>
      </section>
      <form class="modal-card user-card" id="userForm" hidden>
        <h2 id="userModalTitle" hidden></h2>
        <label class="user-label" for="userNameInput">ユーザー名</label>
        <input id="userNameInput" class="user-input" type="text" maxlength="20" autocomplete="nickname" required />
        <p class="user-error" id="userError" role="alert"></p>
        <div class="modal-actions">
          <button class="btn btn-stop" id="cancelUser" type="button" hidden>キャンセル</button>
          <button class="btn btn-primary" type="submit">このユーザー名で始める</button>
        </div>
      </form>
      <section class="onboarding-message welcome-message" id="welcomeMessage" hidden>
        <div class="welcome-headline">
          <p>ようこそ</p>
          <h2 id="welcomeName"></h2>
        </div>
        <small class="welcome-tagline">あなただけのAIライブ配信を始めましょう</small>
      </section>
    </div>

    <!-- 振り返りモーダル -->
    <div class="modal" id="summaryModal" hidden>
      <div class="modal-card">
        <h2>今日の配信の振り返り</h2>
        <p class="modal-body" id="summaryText">まとめています…</p>
        <div class="modal-actions">
          <button class="btn btn-primary" id="viewArchive">カレンダーで見る</button>
          <button class="btn btn-stop" id="closeSummary">とじる</button>
        </div>
      </div>
    </div>

    <!-- 配信アーカイブカレンダー -->
    <div class="modal archive-modal" id="archiveModal" hidden>
      <div class="archive-card">
        <div class="archive-head">
          <div>
            <p class="archive-kicker">STREAM LIBRARY</p>
            <h2>配信アーカイブ</h2>
          </div>
          <button class="icon-btn" id="closeArchive" type="button" aria-label="閉じる">×</button>
        </div>
        <div class="archive-layout">
          <section class="calendar-panel">
            <div class="calendar-nav">
              <button class="icon-btn" id="prevMonth" type="button" aria-label="前の月">‹</button>
              <h3 id="calendarTitle"></h3>
              <button class="icon-btn" id="nextMonth" type="button" aria-label="次の月">›</button>
            </div>
            <div class="calendar-weekdays" aria-hidden="true">
              <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </section>
          <section class="archive-detail" id="archiveDetail">
            <div class="archive-empty">日付を選ぶと、配信アーカイブと振り返りを確認できます。</div>
          </section>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
